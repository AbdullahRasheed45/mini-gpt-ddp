[project]
name = "mini-gpt-ddp"
version = "0.1.0"
description = "GPT pretraining from scratch with DistributedDataParallel on 2x Kaggle T4s"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdullah Rasheed" }]

dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
data = [
    "datasets>=2.18",
    "tiktoken>=0.6",
]
tracking = [
    "wandb>=0.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
